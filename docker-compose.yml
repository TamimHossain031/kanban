services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanban']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://kanban:kanban@db:5432/kanban?schema=public
      JWT_SECRET: dev-secret-change-me-please-32-chars-min
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-32-chars-min
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:3000
    ports: ['4000:4000']
    depends_on:
      db:
        condition: service_healthy
    # migrate → seed → serve. Waiting for a healthy DB is what makes
    # `docker compose up` work on the first try.
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  pgdata:
